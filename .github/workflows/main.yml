name: CI Auto Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Uses the built-in action to download the repository code
        uses: actions/checkout@v4
       
        
      - name: Set up Node.js (Example for Node projects)
        # Uses a specific setup action to configure the environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Runs custom commands using the shell
        run: npm install

      - name: Build project
        run: npm run build
        # Replace 'npm run build' with your specific build command
        

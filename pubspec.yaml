name: flutter_weather
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  country_picker: ^2.0.20
  cupertino_icons: ^1.0.0
  google_fonts: ^6.1.0
  geolocator: ^9.0.2
  http: ^1.1.0
  intl: ^0.18.0
  material_floating_search_bar_2: ^0.5.0
  phosphor_flutter: ^2.0.0
  provider: ^6.0.5
  win32: 5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  win32: 5.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
